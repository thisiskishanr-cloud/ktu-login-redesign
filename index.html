<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KTU Portal – Modern Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="login-card">
        <h1>KTU Student Portal</h1>
        <p class="subtitle">Secure & Optimized Login Experience</p>

        <form>
            <input type="text" placeholder="Register Number" required>
            <input type="password" placeholder="Password" required>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="footer-text">
            Optimized for low-bandwidth networks · Accessible design
        </p>
    </div>
</div>

</body>
</html>
